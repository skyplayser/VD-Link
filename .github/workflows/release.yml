name: Release

# Push a tag like v0.2.0 (or start it by hand under Actions) → builds the macOS
# installers (Apple Silicon and Intel) and the Windows installer and publishes them
# as a GitHub release. Everyone with access to the repository can download them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, z. B. v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  # The fixture library is generated once (Open Fixture Library + QLC+ + own
  # VD fixtures) and shared, so both installers contain exactly the same lamps.
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: public/fixtures
          retention-days: 3

  dist:
    needs: fixtures
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
          - os: windows-latest
            script: dist:win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: public/fixtures
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.files }}
          retention-days: 7

  release:
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -la out
          NOTES=docs/release-notes/$TAG.md; [ -f "$NOTES" ] || NOTES=docs/INSTALLATION.md
          PRE=""; case "$TAG" in *-*) PRE="--prerelease";; esac   # v0.5.0-alpha, -beta … → Vorabversion
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "VD-Link $TAG" --notes-file "$NOTES" $PRE
          gh release upload "$TAG" out/* --clobber
